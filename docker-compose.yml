services:
  Prometheus:
    image: prom/prometheus:v3.15.0
    ports: 
      - "9090:9090"
    volumes:
      - /home/youssef/Prometheus/prometheus.yml:/etc/prometheus/prometheus.yml 
    networks:
      - Prometheus

  alertmanager:
    image: prom/alertmanager:v0.34.1
    ports: 
      - "9093:9093"
    networks:
      - Prometheus


networks:
  Prometheus:
    driver: bridge
