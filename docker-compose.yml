services:
  Prometheus:
    image: prom/prometheus:v3.15.0
    ports: 
      - "9090:9090"
    volumes:
      - /home/youssef/Prometheus/prometheus.yml:/etc/prometheus/prometheus.yml 
      - /home/youssef/Prometheus/alerting.rules.yml:/etc/prometheus/alerting.rules.yml  
    networks:
      - Prometheus

  alertmanager:
    image: prom/alertmanager:v0.34.1
    ports: 
      - "9093:9093"
    volumes: 
      - /home/youssef/Prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - /home/youssef/Prometheus/.telegram_bot_token:/etc/alertmanager/.telegram_bot_token
    networks:
      - Prometheus


networks:
  Prometheus:
    driver: bridge
